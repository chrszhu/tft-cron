name: Refresh TFT Data

on:
  # Manual trigger only — run this whenever you have a fresh API key.
  # To schedule automatic runs, uncomment and update the key secret first:
  # schedule:
  #   - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      region:
        description: "Platform region (e.g. na1, euw1)"
        required: false
        default: "na1"
      tier:
        description: "Tier: challenger / grandmaster / master / all"
        required: false
        default: "all"

jobs:
  # ── Job 1: Current set refresh + snapshot push ────────────────────────────
  # Fetches live ladder, computes insights for the active set, writes the
  # static snapshot JSON, then pushes it to the private app repo so Vercel
  # redeploys automatically.
  refresh-current:
    name: "Refresh Set 17 (current)"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run refresh (current set)
        env:
          RIOT_API_KEY:              ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL:              ${{ secrets.DATABASE_URL }}
          TFT_ACTIVE_SET:            ${{ vars.TFT_ACTIVE_SET || '17' }}
          TFT_PATCH_START_TIMESTAMP: ${{ vars.TFT_PATCH_START_TIMESTAMP || '1776211200' }}
        run: |
          REGION="${{ github.event.inputs.region || 'na1' }}"
          TIER="${{ github.event.inputs.tier || 'all' }}"
          echo "=== Normal refresh: Set ${TFT_ACTIVE_SET} | $REGION / $TIER ==="
          python3 scripts/refresh.py --region "$REGION" --tier "$TIER"

      - name: Push snapshot to private app repo
        env:
          APP_REPO_PAT: ${{ secrets.APP_REPO_PAT }}
          APP_REPO:     ${{ vars.APP_REPO }}
        run: |
          SNAPSHOTS=(public/data/snapshot_*.json)
          if [ ! -f "${SNAPSHOTS[0]}" ]; then
            echo "No snapshot files — skipping push."
            exit 0
          fi

          git clone --depth 1 \
            "https://x-access-token:${APP_REPO_PAT}@github.com/${APP_REPO}.git" \
            _app_repo

          mkdir -p _app_repo/public/data
          cp public/data/snapshot_*.json _app_repo/public/data/

          cd _app_repo
          git config user.name  "tft-orchestrator[bot]"
          git config user.email "tft-orchestrator[bot]@users.noreply.github.com"
          git add public/data/snapshot_*.json

          if git diff --cached --quiet; then
            echo "Snapshot unchanged — nothing to push."
          else
            TIMESTAMP=$(date -u "+%Y-%m-%d %H:%M UTC")
            git commit -m "data: refresh TFT snapshot ($TIMESTAMP)"
            git push
            echo "Pushed to ${APP_REPO} — Vercel will redeploy automatically."
          fi

  # ── Job 2: Historical set backfills (parallel matrix) ─────────────────────
  # Fetches match history for stored PUUIDs within each set's time window.
  # Writes to the historical_insights DB table — no snapshot needed.
  # max-parallel: 2 keeps the combined Riot API request rate safe.
  backfill-historical:
    name: "Backfill Set ${{ matrix.set }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false   # if one set fails, keep running the others
      max-parallel: 2    # 2 concurrent jobs → ~2× rate limit usage, still safe
      matrix:
        set: [14, 15, 16]   # add/remove sets here; omit the current set (17)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Backfill Set ${{ matrix.set }}
        env:
          RIOT_API_KEY:   ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          TFT_ACTIVE_SET: ${{ vars.TFT_ACTIVE_SET || '17' }}
        run: |
          REGION="${{ github.event.inputs.region || 'na1' }}"
          TIER="${{ github.event.inputs.tier || 'all' }}"
          echo "=== Backfilling Set ${{ matrix.set }} | $REGION / $TIER ==="
          python3 scripts/refresh.py \
            --region "$REGION" \
            --tier   "$TIER" \
            --backfill-set "${{ matrix.set }}"
