name: Refresh TFT Data

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Platform region (e.g. na1, euw1)"
        required: false
        default: "na1"
      tier:
        description: "Tier: challenger / grandmaster / master / all"
        required: false
        default: "all"
      target_boards:
        description: "Board target for this run (blank = default)"
        required: false
        default: ""
      seed_prev_limit:
        description: "How many previous-set high-elo players to re-resolve (blank = default)"
        required: false
        default: ""

  schedule:
    # Weekly refresh only (Sunday 08:00 UTC). Weekly is plenty for a meta
    # snapshot; use the manual "Run workflow" button for an on-demand refresh.
    - cron: "0 8 * * 0"

  repository_dispatch:
    types: [continue-refresh]

concurrency:
  group: tft-refresh
  cancel-in-progress: true

# Needed so the seed job can commit the updated data/tft.duckdb back to THIS repo.
permissions:
  contents: write

env:
  REGION: ${{ github.event.inputs.region || github.event.client_payload.region || 'na1' }}
  TIER:   ${{ github.event.inputs.tier   || github.event.client_payload.tier   || 'all' }}
  # DuckDB is a local file committed to this repo (no CockroachDB / DATABASE_URL).
  DUCKDB_PATH: ${{ github.workspace }}/data/tft.duckdb
  # Deep weekly run pulls far more; manual input overrides everything.
  TFT_TARGET_BOARDS: >-
    ${{ github.event.inputs.target_boards
      || (github.event.schedule == '0 8 * * 0' && '6000')
      || '1500' }}
  TFT_SEED_PREV_LIMIT: >-
    ${{ github.event.inputs.seed_prev_limit
      || (github.event.schedule == '0 8 * * 0' && '800')
      || '200' }}

jobs:

  # ── Seed / refresh the current set (Set 18) via live-ladder + high-elo crawl ──
  seed-current:
    name: "1 — Set 18 (current)"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      key_expired: ${{ steps.run.outputs.key_expired }}
    steps:
      # Full history so we can commit + push the updated DuckDB file back.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt

      - name: Refresh TFT Academy meta comps (non-fatal)
        # Re-scrape the expert guidance dataset (positioning / stage tips /
        # difficulty / late cap / carousel / augments tip) so the baked snapshot
        # stays current with the live meta. Non-fatal: if tftacademy.com is
        # unreachable, refresh.py falls back to the committed dataset.
        continue-on-error: true
        run: python3 scripts/scrape_tftacademy.py --set "${TFT_ACTIVE_SET:-18}"
        env:
          TFT_ACTIVE_SET: ${{ vars.TFT_ACTIVE_SET || '18' }}

      - name: Seed current set
        id: run
        env:
          RIOT_API_KEY:        ${{ secrets.RIOT_API_KEY }}
          TFT_ACTIVE_SET:      ${{ vars.TFT_ACTIVE_SET || '18' }}
          TFT_TARGET_BOARDS:   ${{ env.TFT_TARGET_BOARDS }}
          TFT_SEED_PREV_LIMIT: ${{ env.TFT_SEED_PREV_LIMIT }}
        run: |
          echo "Target boards: $TFT_TARGET_BOARDS | high-elo seeds: $TFT_SEED_PREV_LIMIT"
          echo "DuckDB: $DUCKDB_PATH"
          python3 scripts/refresh.py --region "$REGION" --tier "$TIER" --seed-current
          EXIT=$?
          [ $EXIT -eq 2 ] && echo "key_expired=true" >> "$GITHUB_OUTPUT"
          exit $EXIT

      # ── Keep the live leaderboard fresh (LP + rank) ──────────────────────────
      # The seed above builds the comp sample in historical_insights but does NOT
      # populate the ranked ladder, so the leaderboard would have no LP/rank. Now
      # that the set has a live challenger ladder, pull it into challenger_players
      # (the table the leaderboard reads). Non-fatal so a hiccup never blocks the
      # comp pipeline. Runs BEFORE the snapshot push so the pushed snapshot's full
      # ladder carries LP/rank.
      - name: Refresh live leaderboard (LP + rank)
        if: always()
        continue-on-error: true
        env:
          RIOT_API_KEY:   ${{ secrets.RIOT_API_KEY }}
          TFT_ACTIVE_SET: ${{ vars.TFT_ACTIVE_SET || '18' }}
        run: |
          python3 scripts/refresh.py --region "$REGION" --tier challenger --ladder-only

      - name: Backfill leaderboard names + insights from seed (DuckDB)
        if: always()
        continue-on-error: true
        env:
          TFT_ACTIVE_SET: ${{ vars.TFT_ACTIVE_SET || '18' }}
        run: |
          python3 -c '
          import os, duckdb
          aset = int(os.environ.get("TFT_ACTIVE_SET", "18"))
          region = os.environ.get("REGION", "na1").lower()
          con = duckdb.connect(os.environ["DUCKDB_PATH"])
          con.execute(
              "UPDATE challenger_players AS cp "
              "SET summoner_name = COALESCE(NULLIF(btrim(hi.summoner_name), chr(39)||chr(39)), cp.summoner_name), "
              "    insights = hi.insights "
              "FROM historical_insights AS hi "
              "WHERE cp.puuid = hi.puuid AND cp.platform = ? AND cp.tier = ? "
              "  AND cp.set_number = ? AND hi.set_number = ? AND hi.insights IS NOT NULL",
              [region, "challenger", aset, aset],
          )
          print("backfilled leaderboard rows from seed")
          con.close()
          '

      # ── Re-export snapshots after the leaderboard backfill (full ladder) ──────
      - name: Re-export snapshots (full ladder + leaderboard)
        if: always()
        continue-on-error: true
        env:
          TFT_ACTIVE_SET: ${{ vars.TFT_ACTIVE_SET || '18' }}
        run: |
          python3 -c '
          import importlib.util, os
          os.environ.setdefault("DUCKDB_PATH", os.path.join(os.getcwd(), "data", "tft.duckdb"))
          spec = importlib.util.spec_from_file_location("refresh", "scripts/refresh.py")
          r = importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
          aset = int(os.environ.get("TFT_ACTIVE_SET", "18"))
          r._export_static_snapshot("na1", "challenger", aset)
          '

      - name: Push snapshot to private app repo
        if: success()
        env:
          APP_REPO_PAT: ${{ secrets.APP_REPO_PAT }}
          APP_REPO:     ${{ vars.APP_REPO }}
          NTFY_TOPIC:   ${{ vars.NTFY_TOPIC || 'tft-cron-alert' }}
        run: |
          SNAPSHOTS=(public/data/snapshot_*.json public/data/sets_*.json)
          [ -f "${SNAPSHOTS[0]}" ] || { echo "No snapshot — skipping."; exit 0; }
          # ── Guardrail: refuse to ship a degraded live snapshot ───────────────
          # Catches regressions (like the with_opener bug) that would silently
          # strip team codes / openers. If the current-set snapshot is degraded we
          # keep the last-good snapshot in place and alert instead of overwriting.
          LIVE=public/data/snapshot_na1_challenger.json
          if [ -f "$LIVE" ]; then
            if ! python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); arch=(d.get("winningBoards") or d).get("archetypes") or d.get("archetypes") or []; n=len(arch); tc=sum(1 for a in arch if a.get("teamCode")); op=sum(1 for a in arch if a.get("opener")); print(f"[validate] archetypes={n} teamCode={tc} opener={op}"); sys.exit(0 if (n>0 and tc>=0.8*n and op>=0.8*n) else 3)' "$LIVE"; then
              curl -s -X POST "https://ntfy.sh/${NTFY_TOPIC}" \
                -H "Title: TFT Cron — Degraded Snapshot (not pushed)" \
                -H "Priority: high" -H "Tags: warning" \
                -d "Live snapshot was missing team codes/openers — kept last-good and skipped push. Check refresh.py enrichment." || true
              echo "Degraded snapshot; skipping push."
              exit 0
            fi
          fi
          git clone --depth 1 \
            "https://x-access-token:${APP_REPO_PAT}@github.com/${APP_REPO}.git" _app
          mkdir -p _app/public/data
          cp public/data/snapshot_*.json _app/public/data/ 2>/dev/null || true
          cp public/data/sets_*.json     _app/public/data/ 2>/dev/null || true
          cd _app
          git config user.name  "tft-orchestrator[bot]"
          git config user.email "tft-orchestrator[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "data: refresh Set 18 snapshot ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push && echo "Pushed — Vercel will redeploy."
          fi

      # ── Persist DuckDB state back to THIS repo (bounded via compaction) ───────
      # Commits data/tft.duckdb so accumulated current-set state survives between
      # weekly runs. compact_duckdb.py rewrites the file WITHOUT the transient
      # historical_insights table so it stays ~40 MB (under GitHub's 100 MB limit,
      # no LFS needed).
      - name: Commit DuckDB state back to cron repo
        if: always()
        run: |
          python3 scripts/compact_duckdb.py || { echo "compaction failed"; exit 0; }
          git config user.name  "tft-orchestrator[bot]"
          git config user.email "tft-orchestrator[bot]@users.noreply.github.com"
          git add data/tft.duckdb
          if git diff --cached --quiet; then
            echo "DuckDB unchanged — nothing to commit."
          else
            git commit -m "state: DuckDB after refresh ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push && echo "Committed updated DuckDB state."
          fi

  # ── Notify on key expiry, retry on timeout ───────────────────────────────────
  finish:
    name: "2 — Notify / Retry"
    needs: [seed-current]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarise
        run: echo "Set18 result ${{ needs.seed-current.result }}"

      - name: Notify — API key expired
        if: needs.seed-current.outputs.key_expired == 'true'
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'tft-cron-alert' }}
        run: |
          curl -s -X POST "https://ntfy.sh/${NTFY_TOPIC}" \
            -H "Title: TFT Cron — API Key Expired" \
            -H "Priority: high" -H "Tags: key,warning" \
            -d "Your Riot API key has expired. Update RIOT_API_KEY in GitHub Secrets and re-run."

      # Retry on failure, but CAPPED so a deterministic crash can't loop forever.
      - name: Retry if failed (capped, not key expiry)
        if: |
          needs.seed-current.outputs.key_expired != 'true' &&
          needs.seed-current.result == 'failure'
        env:
          ORCHESTRATOR_PAT: ${{ secrets.ORCHESTRATOR_PAT }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'tft-cron-alert' }}
          ATTEMPT: ${{ github.event.client_payload.attempt || 1 }}
          MAX_ATTEMPTS: "3"
        run: |
          if [ "${ATTEMPT}" -ge "${MAX_ATTEMPTS}" ]; then
            echo "Reached max attempts (${ATTEMPT}/${MAX_ATTEMPTS}); giving up."
            curl -s -X POST "https://ntfy.sh/${NTFY_TOPIC}" \
              -H "Title: TFT Cron — Refresh Failing" \
              -H "Priority: high" -H "Tags: rotating_light" \
              -d "Refresh failed ${MAX_ATTEMPTS}x in a row (not a key issue). Check the Actions logs." || true
            exit 0
          fi
          NEXT=$((ATTEMPT + 1))
          curl -s -X POST \
            -H "Authorization: token $ORCHESTRATOR_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/chrszhu/tft-cron/dispatches \
            -d "{\"event_type\":\"continue-refresh\",\"client_payload\":{\"region\":\"$REGION\",\"tier\":\"$TIER\",\"attempt\":${NEXT}}}"
          echo "Retry ${NEXT}/${MAX_ATTEMPTS} queued."
