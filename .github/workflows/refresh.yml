name: Refresh TFT Data

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Platform region (e.g. na1, euw1)"
        required: false
        default: "na1"
      tier:
        description: "Tier: challenger / grandmaster / master / all"
        required: false
        default: "challenger"

  # Fired automatically by the "retry" job when a run times out mid-way.
  # Treated identically to a manual trigger.
  repository_dispatch:
    types: [continue-refresh]

env:
  REGION: ${{ github.event.inputs.region || github.event.client_payload.region || 'na1' }}
  TIER:   ${{ github.event.inputs.tier   || github.event.client_payload.tier   || 'challenger' }}

jobs:

  # ── Step 1: Current set (Set 17) ────────────────────────────────────────────
  # Fetches the live ladder + last 30 days of matches per player.
  # Uses a cursor so re-runs only fetch NEW matches — fast if mostly done.
  refresh-current:
    name: "1 — Set 17 (current)"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Run refresh
        env:
          RIOT_API_KEY:   ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          TFT_ACTIVE_SET: ${{ vars.TFT_ACTIVE_SET || '17' }}
        run: python3 scripts/refresh.py --region "$REGION" --tier "$TIER"

      - name: Push snapshot to private app repo
        env:
          APP_REPO_PAT: ${{ secrets.APP_REPO_PAT }}
          APP_REPO:     ${{ vars.APP_REPO }}
        run: |
          SNAPSHOTS=(public/data/snapshot_*.json)
          [ -f "${SNAPSHOTS[0]}" ] || { echo "No snapshot — skipping."; exit 0; }
          git clone --depth 1 \
            "https://x-access-token:${APP_REPO_PAT}@github.com/${APP_REPO}.git" _app
          mkdir -p _app/public/data
          cp public/data/snapshot_*.json _app/public/data/
          cd _app
          git config user.name  "tft-orchestrator[bot]"
          git config user.email "tft-orchestrator[bot]@users.noreply.github.com"
          git add public/data/snapshot_*.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "data: refresh TFT snapshot ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push && echo "Pushed — Vercel will redeploy."
          fi

  # ── Step 2: Backfill Set 14 ──────────────────────────────────────────────────
  # Only runs if Step 1 succeeded.
  # Already-processed players are skipped, so re-runs resume from where
  # a previous timed-out run left off.
  backfill-14:
    name: "2 — Set 14 (backfill)"
    needs: refresh-current
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Backfill Set 14
        env:
          RIOT_API_KEY:   ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          TFT_ACTIVE_SET: ${{ vars.TFT_ACTIVE_SET || '17' }}
        run: python3 scripts/refresh.py --region "$REGION" --tier "$TIER" --backfill-set 14

  # ── Step 3: Backfill Set 15 ──────────────────────────────────────────────────
  backfill-15:
    name: "3 — Set 15 (backfill)"
    needs: backfill-14
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Backfill Set 15
        env:
          RIOT_API_KEY:   ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          TFT_ACTIVE_SET: ${{ vars.TFT_ACTIVE_SET || '17' }}
        run: python3 scripts/refresh.py --region "$REGION" --tier "$TIER" --backfill-set 15

  # ── Step 4: Backfill Set 16 ──────────────────────────────────────────────────
  backfill-16:
    name: "4 — Set 16 (backfill)"
    needs: backfill-15
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Backfill Set 16
        env:
          RIOT_API_KEY:   ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          TFT_ACTIVE_SET: ${{ vars.TFT_ACTIVE_SET || '17' }}
        run: python3 scripts/refresh.py --region "$REGION" --tier "$TIER" --backfill-set 16

  # ── Step 5: Auto-retry if anything failed or timed out ───────────────────────
  # Runs last, regardless of whether earlier jobs succeeded or failed.
  # If any step didn't finish, fires a repository_dispatch to restart the
  # whole workflow — each job resumes from where it left off (cursor / skip).
  # Requires ORCHESTRATOR_PAT: a classic GitHub token with the "repo" scope.
  # Create it once at: github.com/settings/tokens → Tokens (classic) → check "repo"
  retry:
    name: "5 — Retry if incomplete"
    needs: [refresh-current, backfill-14, backfill-15, backfill-16]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check if all jobs passed
        id: check
        run: |
          S17="${{ needs.refresh-current.result }}"
          S14="${{ needs.backfill-14.result }}"
          S15="${{ needs.backfill-15.result }}"
          S16="${{ needs.backfill-16.result }}"
          echo "Results → Set17:$S17  Set14:$S14  Set15:$S15  Set16:$S16"
          # "skipped" counts as incomplete (earlier job failed so later ones were skipped)
          if [ "$S17" = "success" ] && [ "$S14" = "success" ] && \
             [ "$S15" = "success" ] && [ "$S16" = "success" ]; then
            echo "done=true" >> $GITHUB_OUTPUT
          else
            echo "done=false" >> $GITHUB_OUTPUT
          fi

      - name: All done!
        if: steps.check.outputs.done == 'true'
        run: echo "✅ All sets complete — no retry needed."

      - name: Trigger next run to resume
        if: steps.check.outputs.done == 'false'
        env:
          ORCHESTRATOR_PAT: ${{ secrets.ORCHESTRATOR_PAT }}
        run: |
          echo "⏳ Some jobs didn't finish — triggering next run to resume…"
          curl -s -X POST \
            -H "Authorization: token $ORCHESTRATOR_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/chrszhu/tft-cron/dispatches \
            -d "{\"event_type\":\"continue-refresh\",\"client_payload\":{\"region\":\"$REGION\",\"tier\":\"$TIER\"}}"
          echo "Next run queued — it will resume from where this one stopped."
