name: Refresh TFT Data

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Platform region (e.g. na1, euw1)"
        required: false
        default: "na1"
      tier:
        description: "Tier: challenger / grandmaster / master / all"
        required: false
        default: "challenger"

  repository_dispatch:
    types: [continue-refresh]

concurrency:
  group: tft-refresh
  cancel-in-progress: true

env:
  REGION: ${{ github.event.inputs.region || github.event.client_payload.region || 'na1' }}
  TIER:   ${{ github.event.inputs.tier   || github.event.client_payload.tier   || 'challenger' }}

jobs:

  # ── Set 12 backfill ───────────────────────────────────────────────────────────
  backfill-12:
    name: "1 — Set 12 (backfill)"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      key_expired: ${{ steps.run.outputs.key_expired }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Backfill Set 12
        id: run
        env:
          RIOT_API_KEY:   ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          TFT_ACTIVE_SET: ${{ vars.TFT_ACTIVE_SET || '17' }}
        run: |
          python3 scripts/refresh.py --region "$REGION" --tier "$TIER" --backfill-set 12
          EXIT=$?
          [ $EXIT -eq 2 ] && echo "key_expired=true" >> "$GITHUB_OUTPUT"
          exit $EXIT

  # ── Set 13 backfill ───────────────────────────────────────────────────────────
  backfill-13:
    name: "2 — Set 13 (backfill)"
    needs: backfill-12
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      key_expired: ${{ steps.run.outputs.key_expired }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Backfill Set 13
        id: run
        env:
          RIOT_API_KEY:   ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          TFT_ACTIVE_SET: ${{ vars.TFT_ACTIVE_SET || '17' }}
        run: |
          python3 scripts/refresh.py --region "$REGION" --tier "$TIER" --backfill-set 13
          EXIT=$?
          [ $EXIT -eq 2 ] && echo "key_expired=true" >> "$GITHUB_OUTPUT"
          exit $EXIT

  # ── Handle result — notify on key expiry, retry on timeout ───────────────────
  finish:
    name: "3 — Notify / Retry"
    needs: [backfill-12, backfill-13]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarise results
        run: |
          echo "Set12 : ${{ needs.backfill-12.result }}"
          echo "Set13 : ${{ needs.backfill-13.result }}"

      - name: Notify — API key expired
        if: |
          needs.backfill-12.outputs.key_expired == 'true' ||
          needs.backfill-13.outputs.key_expired == 'true'
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'tft-cron-alert' }}
        run: |
          echo "API key expired — sending notification."
          curl -s -X POST "https://ntfy.sh/${NTFY_TOPIC}" \
            -H "Title: TFT Cron — API Key Expired" \
            -H "Priority: high" \
            -H "Tags: key,warning" \
            -d "Your Riot API key has expired. Update RIOT_API_KEY in GitHub Secrets and re-run."

      - name: Retry if timed out (not key expiry)
        if: |
          needs.backfill-12.outputs.key_expired != 'true' &&
          needs.backfill-13.outputs.key_expired != 'true' &&
          (
            needs.backfill-12.result == 'failure' ||
            needs.backfill-13.result == 'failure'
          )
        env:
          ORCHESTRATOR_PAT: ${{ secrets.ORCHESTRATOR_PAT }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $ORCHESTRATOR_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/chrszhu/tft-cron/dispatches \
            -d "{\"event_type\":\"continue-refresh\",\"client_payload\":{\"region\":\"$REGION\",\"tier\":\"$TIER\"}}"
          echo "Next run queued — resumes from where this one stopped."
