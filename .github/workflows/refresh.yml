name: Refresh TFT Data

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Platform region (e.g. na1, euw1)"
        required: false
        default: "na1"
      tier:
        description: "Tier: challenger / grandmaster / master / all"
        required: false
        default: "challenger"
      skip_current:
        description: "Skip Set 17 refresh and go straight to historical backfills (true/false)"
        required: false
        default: "false"

  repository_dispatch:
    types: [continue-refresh]

concurrency:
  group: tft-refresh
  cancel-in-progress: true

env:
  REGION: ${{ github.event.inputs.region || github.event.client_payload.region || 'na1' }}
  TIER:   ${{ github.event.inputs.tier   || github.event.client_payload.tier   || 'challenger' }}

jobs:

  # ── Step 1: Current set (Set 17) ─────────────────────────────────────────────
  refresh-current:
    name: "1 — Set 17 (current)"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      key_expired: ${{ steps.run.outputs.key_expired }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Run refresh
        id: run
        env:
          RIOT_API_KEY:   ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          TFT_ACTIVE_SET: ${{ vars.TFT_ACTIVE_SET || '17' }}
          SKIP_CURRENT:   ${{ github.event.inputs.skip_current || github.event.client_payload.skip_current || 'false' }}
        run: |
          if [ "$SKIP_CURRENT" = "true" ]; then
            echo "Skipping Set 17 refresh as requested."
          else
            python3 scripts/refresh.py --region "$REGION" --tier "$TIER"
            EXIT=$?
            if [ $EXIT -eq 2 ]; then
              echo "key_expired=true" >> "$GITHUB_OUTPUT"
              exit 2
            fi
          fi
      - name: Push snapshot to private app repo
        if: success()
        env:
          APP_REPO_PAT: ${{ secrets.APP_REPO_PAT }}
          APP_REPO:     ${{ vars.APP_REPO }}
        run: |
          SNAPSHOTS=(public/data/snapshot_*.json)
          [ -f "${SNAPSHOTS[0]}" ] || { echo "No snapshot — skipping."; exit 0; }
          git clone --depth 1 \
            "https://x-access-token:${APP_REPO_PAT}@github.com/${APP_REPO}.git" _app
          mkdir -p _app/public/data
          cp public/data/snapshot_*.json _app/public/data/
          cd _app
          git config user.name  "tft-orchestrator[bot]"
          git config user.email "tft-orchestrator[bot]@users.noreply.github.com"
          git add public/data/snapshot_*.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "data: refresh TFT snapshot ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push && echo "Pushed — Vercel will redeploy."
          fi

  # ── Step 2: Backfill Set 12 ───────────────────────────────────────────────────
  backfill-12:
    name: "2 — Set 12 (backfill)"
    needs: refresh-current
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      key_expired: ${{ steps.run.outputs.key_expired }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Backfill Set 12
        id: run
        env:
          RIOT_API_KEY:   ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          TFT_ACTIVE_SET: ${{ vars.TFT_ACTIVE_SET || '17' }}
        run: |
          python3 scripts/refresh.py --region "$REGION" --tier "$TIER" --backfill-set 12
          EXIT=$?
          [ $EXIT -eq 2 ] && echo "key_expired=true" >> "$GITHUB_OUTPUT"
          exit $EXIT

  # ── Step 3: Backfill Set 13 ───────────────────────────────────────────────────
  backfill-13:
    name: "3 — Set 13 (backfill)"
    needs: backfill-12
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      key_expired: ${{ steps.run.outputs.key_expired }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Backfill Set 13
        id: run
        env:
          RIOT_API_KEY:   ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          TFT_ACTIVE_SET: ${{ vars.TFT_ACTIVE_SET || '17' }}
        run: |
          python3 scripts/refresh.py --region "$REGION" --tier "$TIER" --backfill-set 13
          EXIT=$?
          [ $EXIT -eq 2 ] && echo "key_expired=true" >> "$GITHUB_OUTPUT"
          exit $EXIT

  # ── Step 4: Backfill Set 14 ───────────────────────────────────────────────────
  backfill-14:
    name: "4 — Set 14 (backfill)"
    needs: backfill-13
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      key_expired: ${{ steps.run.outputs.key_expired }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Backfill Set 14
        id: run
        env:
          RIOT_API_KEY:   ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          TFT_ACTIVE_SET: ${{ vars.TFT_ACTIVE_SET || '17' }}
        run: |
          python3 scripts/refresh.py --region "$REGION" --tier "$TIER" --backfill-set 14
          EXIT=$?
          [ $EXIT -eq 2 ] && echo "key_expired=true" >> "$GITHUB_OUTPUT"
          exit $EXIT

  # ── Step 5: Backfill Set 15 ───────────────────────────────────────────────────
  backfill-15:
    name: "5 — Set 15 (backfill)"
    needs: backfill-14
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      key_expired: ${{ steps.run.outputs.key_expired }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Backfill Set 15
        id: run
        env:
          RIOT_API_KEY:   ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          TFT_ACTIVE_SET: ${{ vars.TFT_ACTIVE_SET || '17' }}
        run: |
          python3 scripts/refresh.py --region "$REGION" --tier "$TIER" --backfill-set 15
          EXIT=$?
          [ $EXIT -eq 2 ] && echo "key_expired=true" >> "$GITHUB_OUTPUT"
          exit $EXIT

  # ── Step 6: Backfill Set 16 ───────────────────────────────────────────────────
  backfill-16:
    name: "6 — Set 16 (backfill)"
    needs: backfill-15
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      key_expired: ${{ steps.run.outputs.key_expired }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Backfill Set 16
        id: run
        env:
          RIOT_API_KEY:   ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          TFT_ACTIVE_SET: ${{ vars.TFT_ACTIVE_SET || '17' }}
        run: |
          python3 scripts/refresh.py --region "$REGION" --tier "$TIER" --backfill-set 16
          EXIT=$?
          [ $EXIT -eq 2 ] && echo "key_expired=true" >> "$GITHUB_OUTPUT"
          exit $EXIT

  # ── Step 7: Handle result — notify on key expiry, retry on timeout ────────────
  finish:
    name: "7 — Notify / Retry"
    needs: [refresh-current, backfill-12, backfill-13, backfill-14, backfill-15, backfill-16]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarise results
        run: |
          echo "Set17  : ${{ needs.refresh-current.result }}"
          echo "Set12  : ${{ needs.backfill-12.result }}"
          echo "Set13  : ${{ needs.backfill-13.result }}"
          echo "Set14  : ${{ needs.backfill-14.result }}"
          echo "Set15  : ${{ needs.backfill-15.result }}"
          echo "Set16  : ${{ needs.backfill-16.result }}"

      - name: Notify — API key expired
        if: |
          needs.refresh-current.outputs.key_expired == 'true' ||
          needs.backfill-12.outputs.key_expired     == 'true' ||
          needs.backfill-13.outputs.key_expired     == 'true' ||
          needs.backfill-14.outputs.key_expired     == 'true' ||
          needs.backfill-15.outputs.key_expired     == 'true' ||
          needs.backfill-16.outputs.key_expired     == 'true'
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'tft-cron-alert' }}
        run: |
          echo "🔑 API key expired — sending notification and stopping."
          curl -s -X POST "https://ntfy.sh/${NTFY_TOPIC}" \
            -H "Title: TFT Cron — API Key Expired" \
            -H "Priority: high" \
            -H "Tags: key,warning" \
            -d "Your Riot API key has expired. Update RIOT_API_KEY in the tft-cron GitHub Secrets and re-run the workflow."

      - name: Retry if timed out (not key expiry)
        if: |
          needs.refresh-current.outputs.key_expired != 'true' &&
          needs.backfill-12.outputs.key_expired     != 'true' &&
          needs.backfill-13.outputs.key_expired     != 'true' &&
          needs.backfill-14.outputs.key_expired     != 'true' &&
          needs.backfill-15.outputs.key_expired     != 'true' &&
          needs.backfill-16.outputs.key_expired     != 'true' &&
          (
            needs.refresh-current.result == 'failure' ||
            needs.backfill-12.result     == 'failure' ||
            needs.backfill-13.result     == 'failure' ||
            needs.backfill-14.result     == 'failure' ||
            needs.backfill-15.result     == 'failure' ||
            needs.backfill-16.result     == 'failure'
          )
        env:
          ORCHESTRATOR_PAT: ${{ secrets.ORCHESTRATOR_PAT }}
        run: |
          SKIP="${{ github.event.inputs.skip_current || github.event.client_payload.skip_current || 'false' }}"
          curl -s -X POST \
            -H "Authorization: token $ORCHESTRATOR_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/chrszhu/tft-cron/dispatches \
            -d "{\"event_type\":\"continue-refresh\",\"client_payload\":{\"region\":\"$REGION\",\"tier\":\"$TIER\",\"skip_current\":\"$SKIP\"}}"
          echo "✅ Next run queued — resumes from where this one stopped."
